<!DOCTYPE html>
<html lang="multi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AresCraftX</title>
    <link rel="icon" type="image/png" href="ru/assets/logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="ru/assets/logo.png" sizes="192x192">
    <link rel="apple-touch-icon" href="ru/assets/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff8800">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta property="og:title" content="AresCraftX — Minecraft Ecosystem">
    <meta property="og:description" content="Minecraft server with unique modes, anti-cheat, launcher and communication platform">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arescraftx.online">
    <meta property="og:site_name" content="AresCraftX">
    <meta property="og:image" content="https://arescraftx.online/ru/assets/logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #06050a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background effects */
        .bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
        }

        .bg-orb-1 {
            width: 600px; height: 600px;
            background: #ff8800;
            top: -200px; left: -150px;
            animation: orbFloat1 20s ease-in-out infinite;
        }

        .bg-orb-2 {
            width: 500px; height: 500px;
            background: #ff4400;
            bottom: -200px; right: -100px;
            animation: orbFloat2 25s ease-in-out infinite;
        }

        .bg-orb-3 {
            width: 400px; height: 400px;
            background: #ffaa00;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 18s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(100px, 80px); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-80px, -60px); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
        }

        .bg-grid {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(255,136,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,136,0,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Main container */
        .redirect-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
            max-width: 560px;
            width: 100%;
        }

        /* Logo */
        .logo-wrapper {
            margin-bottom: 32px;
            animation: fadeInUp 0.8s ease-out;
        }

        .logo-wrapper img {
            width: 96px;
            height: 96px;
            border-radius: 20px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(255,136,0,0.3));
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 30px rgba(255,136,0,0.3)); }
            50% { filter: drop-shadow(0 0 50px rgba(255,136,0,0.5)); }
        }

        .logo-wrapper h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff8800, #ffaa00, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        .logo-wrapper .subtitle {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #888;
            font-weight: 400;
            letter-spacing: 2px;
        }

        /* Language selector */
        .lang-selector {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .lang-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 28px 36px;
            border-radius: 16px;
            background: rgba(255,136,0,0.06);
            border: 1px solid rgba(255,136,0,0.15);
            color: #e0e0e0;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 160px;
            position: relative;
            overflow: hidden;
        }

        .lang-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,136,0,0.1), rgba(255,68,0,0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lang-btn:hover::before {
            opacity: 1;
        }

        .lang-btn:hover {
            border-color: rgba(255,136,0,0.5);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(255,136,0,0.15);
        }

        .lang-btn:active {
            transform: translateY(-1px);
        }

        .lang-btn .flag {
            font-size: 2.4rem;
            line-height: 1;
        }

        .lang-btn .lang-name {
            font-size: 1.05rem;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .lang-btn .lang-desc {
            font-size: 0.78rem;
            color: #777;
            position: relative;
            z-index: 1;
        }

        /* Auto-redirect info */
        .auto-redirect {
            margin-top: 36px;
            font-size: 0.82rem;
            color: #555;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .auto-redirect .countdown {
            color: #ff8800;
            font-weight: 600;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,136,0,0.2);
            border-top-color: #ff8800;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .redirect-footer {
            margin-top: 48px;
            font-size: 0.72rem;
            color: #444;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .logo-wrapper h1 {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }

            .lang-selector {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            .lang-btn {
                min-width: 220px;
                padding: 20px 28px;
                flex-direction: row;
                gap: 16px;
            }

            .lang-btn .flag {
                font-size: 1.8rem;
            }

            .lang-btn .lang-desc {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-canvas">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
        <div class="bg-grid"></div>
    </div>

    <!-- Content -->
    <div class="redirect-container">
        <div class="logo-wrapper">
            <img src="ru/assets/logo.png" alt="AresCraftX" onerror="this.style.display='none'">
            <h1>ARESCRAFTX</h1>
            <div class="subtitle">MINECRAFT ECOSYSTEM</div>
        </div>

        <div class="lang-selector">
            <a href="ru/main/index.html" class="lang-btn" data-lang="ru">
                <span class="flag">🇷🇺</span>
                <div>
                    <div class="lang-name">Русский</div>
                    <div class="lang-desc">Перейти на сайт</div>
                </div>
            </a>
            <a href="en/main/index.html" class="lang-btn" data-lang="en">
                <span class="flag">🇬🇧</span>
                <div>
                    <div class="lang-name">English</div>
                    <div class="lang-desc">Enter the site</div>
                </div>
            </a>
        </div>

        <div class="auto-redirect" id="autoRedirect">
            <span class="spinner"></span>
            Auto-redirect in <span class="countdown" id="countdown">3</span>s...
        </div>

        <div class="redirect-footer">
            &copy; 2021–2026 AresCraftX · play.arescraftx.online
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            var RU_PATH = 'ru/main/index.html';
            var EN_PATH = 'en/main/index.html';

            // Determine preferred language
            function getPreferredLang() {
                // 1. Check localStorage (user's previous choice)
                try {
                    var saved = localStorage.getItem('arescraftx_lang');
                    if (saved === 'ru' || saved === 'en') return saved;
                } catch(e) {}

                // 2. Check browser language
                var nav = navigator.language || navigator.userLanguage || navigator.browserLanguage || '';
                var lang = nav.toLowerCase().substring(0, 2);

                if (lang === 'ru' || lang === 'uk' || lang === 'be' || lang === 'kk') {
                    return 'ru'; // Russian, Ukrainian, Belarusian, Kazakh → RU
                }

                return 'en'; // Default to English
            }

            // Save language choice when user clicks manually
            var langBtns = document.querySelectorAll('.lang-btn');
            for (var i = 0; i < langBtns.length; i++) {
                langBtns[i].addEventListener('click', function(e) {
                    var lang = this.getAttribute('data-lang');
                    try { localStorage.setItem('arescraftx_lang', lang); } catch(e) {}
                    // Let the link navigate naturally
                });
            }

            // Auto-redirect with countdown
            var preferred = getPreferredLang();
            var target = preferred === 'ru' ? RU_PATH : EN_PATH;
            var countdownEl = document.getElementById('countdown');
            var autoRedirectEl = document.getElementById('autoRedirect');

            var seconds = 3;
            var timer = setInterval(function() {
                seconds--;
                if (countdownEl) countdownEl.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.href = target;
                }
            }, 1000);

            // Cancel auto-redirect if user clicks a language button
            for (var j = 0; j < langBtns.length; j++) {
                langBtns[j].addEventListener('click', function() {
                    clearInterval(timer);
                    if (autoRedirectEl) autoRedirectEl.innerHTML = '';
                });
            }

            // Also cancel on any scroll or key press (user is making a choice)
            var cancelOnInteraction = function() {
                clearInterval(timer);
                if (autoRedirectEl) {
                    autoRedirectEl.innerHTML = preferred === 'ru'
                        ? 'Нажмите на язык для перехода'
                        : 'Click a language to continue';
                }
                document.removeEventListener('wheel', cancelOnInteraction);
                document.removeEventListener('keydown', cancelOnInteraction);
                document.removeEventListener('touchstart', cancelOnInteraction);
            };

            document.addEventListener('wheel', cancelOnInteraction);
            document.addEventListener('keydown', cancelOnInteraction);
            document.addEventListener('touchstart', cancelOnInteraction);
        })();
    </script>
</body>
</html>
