# AresCraftX — Nginx Security Config
# Добавить в server block вашего nginx.conf

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

# Cache static assets
location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Cache HTML for shorter time
location ~* \.html$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    add_header X-Frame-Options "DENY" always;
}

# Security Headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://api.qrserver.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://api.qrserver.com https://ggyaitqgukjgcjscvwjj.supabase.co; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https://ggyaitqgukjgcjscvwjj.supabase.co https://api.mcsrvstat.us; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Disable directory listing
autoindex off;

# Block sensitive files
location ~* \.(env|sql|json|log|bak)$ {
    deny all;
    return 404;
}

# Block specific config files
location ~* /(config\.json|database\.sql|SECURITY\.md|nginx-security\.conf)$ {
    deny all;
    return 404;
}

# Force HTTPS
if ($scheme != "https") {
    return 301 https://$host$request_uri;
}
